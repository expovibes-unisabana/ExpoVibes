 ter:{t:'Términos y condiciones',s:[
 ['1. Qué es ExpoVibes',['ExpoVibes es una página web de apoyo para vivir Expopaz. Fue creada como proyecto académico por estudiantes de la materia Evaluación e Intervención Social, con la profesora Pilar Baracaldo Silva. No es un canal oficial de la Universidad ni reemplaza las instrucciones de tus docentes.','La administra '+CONF.resp+'. Contacto: '+cEmail()+'.']],
 ['2. Quién puede usarla',['Está dirigida a estudiantes, docentes y monitores de Expopaz que sean mayores de 18 años. Si eres menor de edad, no uses la página sin la autorización de tu representante legal y de tu docente.','Para que tus respuestas lleguen a tus profesoras y monitores, debes crear una cuenta con tu correo e iniciar sesión. Sin cuenta, la página funciona, pero lo que escribas queda solo en tu dispositivo.']],

/* ============ Conflictos: «Cuéntanos qué te pasó» (lectura guiada de una situación real) ============
   Funciona dentro del navegador con reglas, sin enviar el texto a ningún servidor ni guardarlo. */
var SIT_CAT=[
{id:"carga",n:"Reparto desigual del trabajo",re:/(hace(n|mos)? (casi )?todo|todo el trabajo|no ayud|no aport|no cumpl|no hizo|no hace\b|no hacen|no entreg|no ha(n)? (entregado|hecho|cumplido|aportado|avanzado)|su parte|mi parte|sobrecarg|me dejaron sol|dejan(me)? (todo|sol)|cargo con|una sola persona|unos pocos|reparto|reparti)/,
 lec:"Casi nunca es solo pereza. Suele haber un reparto que nunca quedó claro (quién hace qué y para cuándo), prioridades distintas entre materias, o alguien que no se siente con permiso para pedir ayuda. El riesgo es que quien más hace termine con resentimiento y quien menos hace se ponga a la defensiva, y entonces ya no se habla de la tarea sino de la persona.",
 preg:"¿Estaba escrito, con nombre y fecha, qué le tocaba a cada quien?",
 hoy:["Anota solo hechos: qué se acordó, qué se entregó y qué falta.","Revisa el Acuerdo de equipo: ¿el compromiso de cada persona estaba claro?","Antes de concluir nada, pregunta: «¿cómo vas con tu parte?»."],
 sem:["Redistribuyan las tareas con nombre y fecha en el Calendario de equipo.","Pongan un punto de control a mitad de semana.","Si sigue igual, lleven hechos (no quejas) a la profesora."],
 dec:"Quiero que revisemos juntos cómo quedó repartido el trabajo, porque siento que la carga no está pareja. ¿Podemos ponerle nombre y fecha a cada tarea?",
 evi:"Frases como «siempre haces lo mismo» o «nunca ayudas»: convierten la conversación en una defensa."},
{id:"silencio",n:"Falta de respuesta o desaparición de alguien",re:/(no (me )?(responde|contesta|contestan|respond)|desaparec|no aparece|no viene|no vino|no asist|no lee|me ignora|ignoran|me dejo en visto|en visto|no se conecta|dejo de (responder|venir)|no da senales)/,
 lec:"El silencio puede tener muchas causas que desde afuera se ven iguales: sobrecarga, un problema personal, vergüenza por haberse atrasado o simple desorganización. Si se interpreta como desinterés, la conversación empieza con una acusación; si se pregunta con cuidado, muchas veces aparece la razón real.",
 preg:"¿Cuándo fue la última vez que hubo contacto y qué se había acordado en ese momento?",
 hoy:["Escríbele en privado, corto y sin reproche, preguntando cómo está.","Cubre lo urgente entre el resto para no frenar la entrega.","Anota fechas y mensajes enviados: te servirán si toca hablar con la profesora."],
 sem:["Acuerden cómo se avisa cuando alguien no puede (un canal y un plazo).","Redistribuyan lo pendiente con fechas concretas.","Si no hay respuesta en unos días, informen a la profesora con los hechos."],
 dec:"Hola, ¿cómo estás? Hace unos días no sabemos de ti y nos preocupa. Queremos saber si necesitas algo y ver cómo ajustamos lo que falta. ¿Podemos hablar hoy o mañana?",
 evi:"Suponer que «no le importa»: no lo sabes y cierra la puerta antes de preguntar."},
{id:"tono",n:"Tono o trato que lastimó",re:/(grit|me hablo mal|me hablaron mal|el tono|me respondio mal|insult|se burl|burla|me trato|me trataron|grosero|grosera|me ofend|ofensa|me critic|me regano|me callo|me humill|me menosprecia|me desprecia|sarcas|me hizo sentir)/,
 lec:"Detrás de un mal tono suele haber cansancio, presión por la entrega o una molestia acumulada que explota con lo último que pasó. Eso explica, pero no justifica. Lo importante es separar lo que se dijo de la forma en que se dijo, y decidir si quieres hablarlo ahora o cuando bajen los ánimos.",
 preg:"¿Fue una vez, en un momento de mucha presión, o se repite?",
 hoy:["Antes de responder, espera a que baje la tensión (un rato, no semanas).","Anota qué se dijo exactamente y cómo te hizo sentir.","Decide si quieres hablarlo a solas o con alguien más presente."],
 sem:["Habla con la persona y describe lo que pasó sin calificarla.","Pidan juntos una forma de tratarse en momentos de tensión (una pausa, por ejemplo).","Si se repite o te sientes irrespetada o irrespetado, cuéntalo a la profesora."],
 dec:"Quiero hablar de lo que pasó cuando [situación]. Me dolió el tono en que se dijo. Prefiero que cuando estemos en desacuerdo lo hablemos con calma. ¿Podemos hacerlo así?",
 evi:"Responder en caliente por el chat: casi siempre empeora lo que ya pasó."},
{id:"decision",n:"Desacuerdo en una decisión",re:/(no estamos de acuerdo|desacuerdo|no quiere|no quieren|impone|imponen|manda|decide sol|deciden sol|no escucha|no me escuchan|no toman en cuenta|no tienen en cuenta|mi idea|mis ideas|discut|pelea|pelear|opiniones distintas|no se ponen de acuerdo|cada uno quiere)/,
 lec:"Un desacuerdo no es el problema: es la señal de que hay intereses distintos sobre la mesa. Lo que lo vuelve conflicto es discutir posiciones («yo quiero esto») en lugar de lo que hay debajo («necesito que quede claro / que no sea tanto trabajo / que se vea bien»). Cuando se nombra la necesidad, suele aparecer una opción que sirve a ambas partes.",
 preg:"¿Qué necesita cada persona detrás de lo que está pidiendo?",
 hoy:["Escribe tu postura y, al lado, la necesidad que hay detrás.","Pregunta a la otra persona qué es lo más importante para ella en esa decisión.","Busquen un criterio común (tiempo, costo, lo que pide la guía)."],
 sem:["Comparen las opciones con ese criterio, por escrito.","Si no hay acuerdo, prueben una versión pequeña de cada una o pidan criterio a la profesora.","Registren lo decidido en el Acuerdo de equipo."],
 dec:"Veo que tenemos ideas distintas sobre [tema]. Para mí lo más importante es [necesidad]. ¿Y para ti? Quizá podamos encontrar una opción que sirva a las dos.",
 evi:"Ganar la discusión: si alguien sale sintiéndose derrotado, el problema vuelve."},
{id:"tiempo",n:"Presión de tiempo o de entregas",re:/(llegamos tarde|muy tarde|plazo|fecha limite|no alcanz|atrasad|nos atras|urgente|ultimo momento|ultima hora|se nos junto|se juntan|cruce de entregas|varias entregas|tantas entregas|no nos da el tiempo|sin tiempo|no tenemos tiempo|contrarreloj)/,
 lec:"Cuando se cruzan entregas, el tiempo se vuelve el centro de todos los conflictos: cualquier cosa pequeña se siente enorme. Casi siempre el problema no es «falta de ganas» sino que no se ha decidido qué es imprescindible y qué se puede recortar.",
 preg:"Si solo pudieran entregar lo esencial, ¿qué sería?",
 hoy:["Hagan dos listas: lo imprescindible y lo deseable.","Recorten lo deseable sin culpa.","Calculen cuánto toma realmente lo imprescindible."],
 sem:["Pongan fechas intermedias en el Calendario de equipo.","Renegocien el alcance con la profesora con una propuesta concreta.","Protejan al menos una pausa para dormir y comer bien."],
 dec:"Estamos justos de tiempo para [entrega]. Propongo que nos enfoquemos en [lo esencial] y dejemos [lo deseable] para si sobra tiempo. ¿Les parece?",
 evi:"Repartir culpas por el atraso: gasta el tiempo que no hay."},
{id:"aliado",n:"Dificultad con la comunidad o el aliado externo",re:/(comunidad|aliad|institucion|fundacion|el lider|la lider|nos cancel|cancelaron|cancelo|no nos dan permiso|permiso|el colegio|la junta|las personas con quienes trabajamos|participantes)/,
 lec:"Las comunidades tienen sus propios tiempos, prioridades y razones. Un cambio de plan o un silencio rara vez tiene que ver con el proyecto: suele ser agenda, desconfianza que se construye despacio o poca claridad sobre lo que se espera. En investigación social, también esto es información del proceso.",
 preg:"¿Está claro, para ambas partes, qué se espera y qué se devuelve?",
 hoy:["Escribe un mensaje corto con dos opciones de fecha.","Avisa hoy a tu profesora o monitora, no al final.","Busca un contacto alterno que sirva de puente."],
 sem:["Definan un plan B de acercamiento (otro espacio, otro horario o una versión virtual).","Ajusten el cronograma y repartan quién insiste con la comunidad.","Documenten lo ocurrido: las dificultades de acceso también cuentan."],
 dec:"Muchas gracias por abrirnos este espacio. Entendemos que sus tiempos son distintos. ¿Podríamos reunirnos el [fecha 1] o el [fecha 2]? Si no, díganos qué momento les queda mejor.",
 evi:"Insistir sin escuchar las razones de la comunidad: puede dañar la confianza."},
{id:"docente",n:"Tensión con la evaluación o con una docente o monitora",re:/(profe|profesor|profesora|docente|monitor|monitora|la nota|calific|jurado|retroaliment|evalu|nos devolvio|nos dijo que estaba mal|correcciones|observaciones)/,
 lec:"Las devoluciones con muchos cambios abruman, y es fácil leerlas como un juicio sobre ustedes y no como información para mejorar. Ordenarlas por prioridad suele bajar la tensión, y pedir una aclaración concreta casi siempre es bien recibido.",
 preg:"¿Qué parte de la observación entienden y qué parte no?",
 hoy:["Lean todas las observaciones juntos, sin responder todavía.","Clasifíquenlas: urgente para la sustentación, importante, opcional.","Anoten las dudas para preguntar, no para adivinar."],
 sem:["Repartan los cambios por persona con fecha.","Pidan una sesión corta de retroalimentación.","Si no alcanzan, propongan qué entregan ya y qué después."],
 dec:"Profe, entendimos las observaciones sobre [A y B]. ¿Podría aclararnos [C]? Proponemos entregar [lo prioritario] el [fecha] y el resto después. ¿Le parece?",
 evi:"Responder defendiéndose: primero entender, luego decidir."},
{id:"emocional",n:"Desgaste o agotamiento",re:/(estres|agot|ansied|no puedo mas|cansad|llor|abruma|desmotiv|me siento mal|no doy mas|sin energia|no tengo ganas|colaps|burnout|desbordad)/,
 lec:"El cansancio es una señal, no una falla personal. En las fases de implementación se acumula trabajo, incertidumbre y otras materias, y cuando el cuerpo está agotado todo conflicto se siente más grande de lo que es. Antes de resolver el conflicto conviene bajar la carga.",
 preg:"¿Cuál es el mínimo que sí o sí tiene que salir esta semana?",

 sem:["Pide ajustar el alcance o los tiempos si hace falta.","Revisa el módulo Bienestar y elige uno o dos hábitos.","Si el desgaste dura más de dos semanas, busca apoyo: ve a Rutas de apoyo."],
 dec:"Equipo, estoy muy cansada o cansado y necesito que ajustemos el ritmo. Propongo enfocarnos esta semana en [mínimo] y hacer una pausa el [día]. ¿Lo hablamos?",

var SIT_ALERTA=/(acoso|acosa|discrimin|amenaz|abuso|violen|me toc|racis|machis|me persigue|me obliga|chantaj|me grita siempre|me da miedo|miedo de ir|me hace sentir inseguro|me hace sentir insegura|burlan de mi|me excluyen|me aislan)/;
var SIT_EMO=[["rabia",/(rabia|furios|molest|brav|enoj|indign|harto|harta|me tiene cansad)/],["tristeza",/(triste|dolid|decepcion|llor|desanim|me dolio)/],["miedo o ansiedad",/(miedo|ansied|nervios|preocup|angust|panico|temor)/],["frustración",/(frustr|impotenc|no se que hacer|no se como|sin salida|me supera)/],["cansancio",/(agot|cansad|estres|sin energia|no puedo mas)/]];

function sitHechos(t){var L=[];
